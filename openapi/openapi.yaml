openapi: 3.0.3
info:
  title: Registro de equipos mineros
  description: |
    API para registrar equipos mineros, consultar si requieren mantenimiento
    y llevar el historial de mantenimientos.

    Las respuestas de error siempre usan el schema `ErrorResponse`.
  version: 1.0.0
servers:
  - url: /
    description: Servidor actual

tags:
  - name: Auth
    description: Autenticación
  - name: Salud
    description: Estado del servicio
  - name: Tipos
    description: Catálogo de tipos de equipo
  - name: Equipos
    description: Alta, consulta, edición y baja de equipos
  - name: Mantenimientos
    description: Historial de mantenimientos de un equipo

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Inicia sesión y devuelve un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [Salud]
      operationId: health
      summary: Estado del servicio (verifica la conexión a la base de datos)
      security: []
      responses:
        '200':
          description: El servicio y la base de datos responden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /tipos:
    get:
      tags: [Tipos]
      operationId: listarTipos
      summary: Lista paginada de los tipos de equipo con su intervalo de mantenimiento
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de tipos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTipoEquipoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /equipos:
    get:
      tags: [Equipos]
      operationId: listarEquipos
      summary: Lista paginada de los equipos con su estado de mantenimiento
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de equipos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEquipoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Equipos]
      operationId: crearEquipo
      summary: Registra un equipo nuevo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipoRequest'
      responses:
        '201':
          description: Equipo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /equipos/{id}:
    parameters:
      - $ref: '#/components/parameters/EquipoId'
    get:
      tags: [Equipos]
      operationId: obtenerEquipo
      summary: Obtiene un equipo por id
      responses:
        '200':
          description: Equipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Equipos]
      operationId: actualizarEquipo
      summary: Edita el código y el horómetro de un equipo
      description: |
        Solo se pueden cambiar `codigo` y `horometro`. El tipo no se puede cambiar una vez creado el equipo
        (si se envía `tipoId` la respuesta es 400). El horómetro nunca baja: un valor menor al actual
        devuelve 422 con el código `HOROMETRO_NO_PUEDE_BAJAR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipoUpdateRequest'
      responses:
        '200':
          description: Equipo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Equipos]
      operationId: eliminarEquipo
      summary: Elimina un equipo y todo su historial (solo ADMIN)
      responses:
        '204':
          description: Equipo eliminado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /equipos/{id}/mantenimientos:
    parameters:
      - $ref: '#/components/parameters/EquipoId'
    post:
      tags: [Mantenimientos]
      operationId: registrarMantenimiento
      summary: Registra un mantenimiento y reinicia el ciclo del equipo
      description: |
        Guarda en el historial el horómetro actual del equipo y actualiza
        `horometroUltimoMant` con ese mismo valor, todo en una sola transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MantenimientoRequest'
      responses:
        '201':
          description: Mantenimiento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MantenimientoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Mantenimientos]
      operationId: listarMantenimientos
      summary: Historial paginado de mantenimientos de un equipo (el más reciente primero)
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página del historial del equipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMantenimientoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Pagina:
      name: page
      in: query
      required: false
      description: Número de página, empezando en 0
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Tamano:
      name: size
      in: query
      required: false
      description: Cantidad de elementos por página (máximo 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    EquipoId:
      name: id
      in: path
      required: true
      description: Identificador del equipo
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Petición inválida (validación, JSON malformado o parámetro con tipo incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Falta el token, es inválido o expiró (o las credenciales son incorrectas)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario no tiene permiso para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto con el estado actual (por ejemplo, código de equipo duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: >-
        La petición es válida pero rompe una regla de negocio: HOROMETRO_NO_PUEDE_BAJAR (el horómetro nuevo es
        menor al actual) o TIPO_NO_MODIFICABLE (se intentó cambiar el tipo de un equipo ya creado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: El cuerpo de la petición supera el tamaño máximo permitido (16 KB) o no declara su longitud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Demasiados intentos fallidos de inicio de sesión desde esta IP (ver el header Retry-After)
      headers:
        Retry-After:
          description: Segundos que hay que esperar antes de volver a intentarlo
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: Nombre de usuario (no puede estar vacío ni ser solo espacios)
          example: admin
        password:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
          description: Contraseña (no puede estar vacía ni ser solo espacios)
          format: password

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Token JWT para enviar en el header Authorization
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Segundos que dura el token
          example: 3600

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        version:
          type: string
          description: Versión (tag de la imagen) que está corriendo
          example: a1b2c3d

    PaginaBase:
      type: object
      description: Datos de paginación comunes a todos los listados
      required: [page, size, totalElements, totalPages, first, last]
      properties:
        page:
          type: integer
          format: int32
          description: Número de esta página (empieza en 0)
          example: 0
        size:
          type: integer
          format: int32
          description: Tamaño de página pedido
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total de elementos en todas las páginas
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total de páginas
          example: 3
        first:
          type: boolean
          description: Es la primera página
        last:
          type: boolean
          description: Es la última página

    PaginaTipoEquipoResponse:
      description: Página de tipos de equipo
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: Elementos de esta página
              items:
                $ref: '#/components/schemas/TipoEquipoResponse'

    PaginaEquipoResponse:
      description: Página de equipos
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: Elementos de esta página
              items:
                $ref: '#/components/schemas/EquipoResponse'

    PaginaMantenimientoResponse:
      description: Página del historial de mantenimientos
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              description: Elementos de esta página
              items:
                $ref: '#/components/schemas/MantenimientoResponse'

    TipoEquipoResponse:
      type: object
      required: [id, nombre, intervaloHoras]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Camión
        intervaloHoras:
          type: integer
          format: int32
          description: Horas de uso entre un mantenimiento y el siguiente
          example: 250

    EquipoRequest:
      type: object
      required: [codigo, tipoId, horometro]
      properties:
        codigo:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9-]+$'
          description: Código único del equipo (letras, números y guiones, sin espacios)
          example: CAM-001
        tipoId:
          type: integer
          format: int64
          minimum: 1
          description: Id de un tipo de equipo existente
          example: 1
        horometro:
          type: number
          minimum: 0
          maximum: 999999.9
          description: Horas acumuladas del equipo (máximo un decimal)
          example: 120.5
          x-field-extra-annotation: '@Digits(integer = 6, fraction = 1)'

    EquipoUpdateRequest:
      type: object
      description: >-
        Lo único que se puede cambiar de un equipo. El tipo es inmutable por trazabilidad, así que acá no existe
        `tipoId` y cualquier campo de más se rechaza con 400.
      additionalProperties: false
      required: [codigo, horometro]
      properties:
        codigo:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9-]+$'
          description: Código único del equipo (letras, números y guiones, sin espacios)
          example: CAM-001
        horometro:
          type: number
          minimum: 0
          maximum: 999999.9
          description: Horas acumuladas del equipo (máximo un decimal). No puede ser menor al valor actual.
          example: 260.0
          x-field-extra-annotation: '@Digits(integer = 6, fraction = 1)'

    EquipoResponse:
      type: object
      required:
        - id
        - codigo
        - tipo
        - horometro
        - horometroUltimoMant
        - horasDesdeUltimoMant
        - horasRestantes
        - requiereMantenimiento
        - estado
        - creadoEn
      properties:
        id:
          type: integer
          format: int64
          example: 7
        codigo:
          type: string
          example: CAM-001
        tipo:
          $ref: '#/components/schemas/TipoEquipoResponse'
        horometro:
          type: number
          example: 310.5
        horometroUltimoMant:
          type: number
          description: Horómetro que tenía el equipo en su último mantenimiento
          example: 0.0
        horasDesdeUltimoMant:
          type: number
          description: Horas trabajadas desde el último mantenimiento (horómetro menos horometroUltimoMant)
          example: 60.0
        horasRestantes:
          type: number
          description: Horas que faltan para el próximo mantenimiento; nunca baja de 0
          example: 190.0
        requiereMantenimiento:
          type: boolean
          description: Se calcula al consultar, no se guarda. Es true cuando horasDesdeUltimoMant alcanza el intervalo del tipo
          example: true
        estado:
          type: string
          description: Texto legible del estado ("OK" o "Requiere mantenimiento")
          example: Requiere mantenimiento
        creadoEn:
          type: string
          format: date-time

    MantenimientoRequest:
      type: object
      properties:
        notas:
          type: string
          maxLength: 500
          description: Observaciones del mantenimiento (opcional; si viene vacía o solo con espacios se guarda como nula)
          example: Cambio de aceite y filtros

    MantenimientoResponse:
      type: object
      required: [id, equipoId, fecha, horometroAlRegistrar]
      properties:
        id:
          type: integer
          format: int64
          example: 3
        equipoId:
          type: integer
          format: int64
          example: 7
        fecha:
          type: string
          format: date-time
        horometroAlRegistrar:
          type: number
          description: Horómetro del equipo en el momento de registrar el mantenimiento
          example: 310.5
        notas:
          type: string
          example: Cambio de aceite y filtros

    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: Campo que falló la validación
          example: codigo
        reason:
          type: string
          description: Motivo del rechazo
          example: debe tener entre 3 y 30 caracteres

    ErrorResponse:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          description: Descripción corta del tipo de error HTTP
          example: Not Found
        code:
          type: string
          description: Código interno estable para que el cliente decida qué hacer
          example: EQUIPO_NO_ENCONTRADO
        message:
          type: string
          example: No existe un equipo con id 99
        path:
          type: string
          example: /equipos/99
        traceId:
          type: string
          description: >-
            Id de correlación de la petición (también viaja en la cabecera X-Trace-Id). Sirve para rastrear
            el error en los logs del servidor.
          example: 7f3c1d2e-9a4b-4f6e-8c11-2b7d5e9a0c34
        details:
          type: array
          description: Detalle por campo en errores de validación
          items:
            $ref: '#/components/schemas/ErrorDetail'
