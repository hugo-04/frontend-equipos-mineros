# Dependabot abre un PR cuando una dependencia o una acción de GitHub tiene versión nueva o una
# vulnerabilidad corregida. Como las acciones están fijadas por SHA, es él quien las mantiene al día.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
