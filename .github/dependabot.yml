# Dependabot abre un PR cuando una dependencia o una acción de GitHub tiene versión nueva o una
# vulnerabilidad corregida. Como las acciones están fijadas por SHA, es él quien las mantiene al día.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Saltos de versión mayor que hoy no son compatibles con el resto del proyecto (se probaron en una copia limpia):
    # - TypeScript 7: el lint se rompe, porque eslint-config-next no carga con él.
    # - eslint 10: funciona, pero eslint-config-next 16 trae plugins (import, jsx-a11y, react) que solo declaran soporte hasta eslint 9.
    # Se revisan a mano cuando el ecosistema los soporte; los parches y menores siguen llegando solos.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
